<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Assinatura Digital
    </title>

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        *{

            margin:0;
            padding:0;

            box-sizing:border-box;
        }

        :root{

            --bg:
                linear-gradient(
                    180deg,
                    #3a2278,
                    #261646,
                    #150d29
                );

            --card:
                rgba(255,255,255,.06);

            --border:
                rgba(255,255,255,.10);

            --text:#fff;

            --text-soft:
                rgba(255,255,255,.72);

            --primary:#6b8cff;

            --primary-hover:#7a9dff;

            --danger:#ef4444;

            --success:#22c55e;

            --shadow:
                0 8px 30px rgba(0,0,0,.22);
        }

        body{

            min-height:100vh;

            background:var(--bg);

            background-size:cover;

            display:flex;
            align-items:center;
            justify-content:center;

            padding:20px;

            font-family:
                'Poppins',
                Arial,
                sans-serif;

            color:var(--text);
        }

        .container{

            width:100%;
            max-width:950px;

            background:var(--card);

            border:1px solid var(--border);

            border-radius:28px;

            backdrop-filter:blur(18px);

            box-shadow:var(--shadow);

            overflow:hidden;
        }

        /* =========================
           HEADER
        ========================= */

        .header{

            padding:28px;

            border-bottom:
                1px solid var(--border);

            display:flex;
            align-items:center;

            gap:18px;
        }

        .header-icon{

            width:72px;
            height:72px;

            border-radius:22px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #8b5cf6
                );

            display:flex;
            align-items:center;
            justify-content:center;

            flex-shrink:0;

            box-shadow:
                0 10px 25px rgba(0,0,0,.20);
        }

        .header-icon i{

            font-size:28px;

            color:#fff;
        }

        .header-text h1{

            font-size:30px;

            margin-bottom:8px;
        }

        .header-text p{

            color:var(--text-soft);

            font-size:14px;

            line-height:1.6;
        }

        /* =========================
           BODY
        ========================= */

        .body{

            padding:28px;
        }

        .info-box{

            display:flex;
            align-items:center;

            gap:14px;

            padding:18px;

            border-radius:18px;

            background:
                rgba(255,255,255,.04);

            border:
                1px solid rgba(255,255,255,.06);

            margin-bottom:24px;
        }

        .info-box i{

            color:var(--primary);

            font-size:22px;
        }

        .info-box p{

            color:var(--text-soft);

            font-size:13px;

            line-height:1.6;
        }

        /* =========================
           CANVAS
        ========================= */

        .canvas-wrapper{

            position:relative;

            border-radius:24px;

            overflow:hidden;

            border:
                2px dashed rgba(255,255,255,.10);

            background:#fff;

            box-shadow:
                inset 0 0 20px rgba(0,0,0,.04);
        }

        canvas{

            width:100%;
            height:420px;

            display:block;

            touch-action:none;

            cursor:crosshair;
        }

        /* =========================
           ACTIONS
        ========================= */

        .actions{

            display:flex;

            gap:16px;

            margin-top:24px;
        }

        button{

            flex:1;

            height:56px;

            border:none;

            border-radius:18px;

            cursor:pointer;

            font-size:15px;
            font-weight:700;

            transition:.25s;

            display:flex;
            align-items:center;
            justify-content:center;

            gap:10px;
        }

        .btn-clear{

            background:
                rgba(239,68,68,.14);

            color:#ff8080;

            border:
                1px solid rgba(239,68,68,.18);
        }

        .btn-clear:hover{

            transform:translateY(-2px);

            background:
                rgba(239,68,68,.20);
        }

        .btn-confirm{

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #8b5cf6
                );

            color:#fff;
        }

        .btn-confirm:hover{

            transform:translateY(-2px);

            background:
                linear-gradient(
                    135deg,
                    var(--primary-hover),
                    #9b6dff
                );
        }

        /* =========================
           SUCCESS
        ========================= */

        .success{

            margin-top:22px;

            display:none;

            align-items:center;
            justify-content:center;

            gap:12px;

            padding:18px;

            border-radius:18px;

            background:
                rgba(34,197,94,.14);

            border:
                1px solid rgba(34,197,94,.18);

            color:#7dffb0;

            font-size:14px;
            font-weight:600;
        }

        .success i{

            font-size:18px;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media(max-width:768px){

            .container{

                border-radius:22px;
            }

            .header{

                flex-direction:column;

                text-align:center;
            }

            .header-text h1{

                font-size:24px;
            }

            .body{

                padding:20px;
            }

            canvas{

                height:320px;
            }

            .actions{

                flex-direction:column;
            }

            button{

                width:100%;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">

        <div class="header-icon">

            <i class="fa-solid fa-signature"></i>

        </div>

        <div class="header-text">

            <h1>
                Assinatura Digital
            </h1>

            <p>
                Utilize o dedo ou caneta touch
                para realizar sua assinatura
                no campo abaixo.
            </p>

        </div>

    </div>

    <!-- BODY -->
    <div class="body">

        <!-- INFO -->
        <div class="info-box">

            <i class="fa-solid fa-tablet-screen-button"></i>

            <p>
                Sua assinatura será enviada
                automaticamente para o sistema
                após a confirmação.
            </p>

        </div>

        <!-- CANVAS -->
        <div class="canvas-wrapper">

            <canvas id="canvas"></canvas>

        </div>

        <!-- BUTTONS -->
        <div class="actions">

            <button class="btn-clear"
                    onclick="limpar()">

                <i class="fa-solid fa-trash"></i>

                Limpar

            </button>

            <button class="btn-confirm"
                    onclick="confirmar()">

                <i class="fa-solid fa-check"></i>

                Confirmar Assinatura

            </button>

        </div>

        <!-- SUCCESS -->
        <div class="success"
             id="successMessage">

            <i class="fa-solid fa-circle-check"></i>

            Assinatura enviada com sucesso!

        </div>

    </div>

</div>

<!-- SOCKET.IO -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>

const socket = io();

const token = "{{ token }}";

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const successMessage =
    document.getElementById(
        "successMessage"
    );

let desenhando = false;

/* =========================
   RESPONSIVO
========================= */

function resizeCanvas() {

    const ratio =
        Math.max(
            window.devicePixelRatio || 1,
            1
        );

    canvas.width =
        canvas.offsetWidth * ratio;

    canvas.height =
        canvas.offsetHeight * ratio;

    ctx.scale(ratio, ratio);

    ctx.lineWidth = 2.8;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.strokeStyle = "#000";
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);

/* =========================
   POSIÇÃO
========================= */

function getPos(e) {

    const rect =
        canvas.getBoundingClientRect();

    if (e.touches) {

        return {

            x:
                e.touches[0].clientX
                - rect.left,

            y:
                e.touches[0].clientY
                - rect.top
        };
    }

    return {

        x:
            e.clientX - rect.left,

        y:
            e.clientY - rect.top
    };
}

/* =========================
   DESENHAR
========================= */

function iniciarDesenho(e) {

    desenhando = true;

    const pos = getPos(e);

    ctx.beginPath();

    ctx.moveTo(pos.x, pos.y);
}

function desenhar(e) {

    if (!desenhando)
        return;

    e.preventDefault();

    const pos = getPos(e);

    ctx.lineTo(pos.x, pos.y);

    ctx.stroke();
}

function pararDesenho() {

    desenhando = false;
}

/* =========================
   LIMPAR
========================= */

function limpar() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    successMessage.style.display =
        "none";
}

/* =========================
   CONFIRMAR
========================= */

function confirmar() {

    const imagem =
        canvas.toDataURL("image/png");

    socket.emit(
        "assinatura_finalizada",
        {

            token: token,

            imagem: imagem
        }
    );

    successMessage.style.display =
        "flex";

    setTimeout(() => {

        window.close();

    }, 1800);
}

/* =========================
   MOUSE
========================= */

canvas.addEventListener(
    "mousedown",
    iniciarDesenho
);

canvas.addEventListener(
    "mousemove",
    desenhar
);

canvas.addEventListener(
    "mouseup",
    pararDesenho
);

canvas.addEventListener(
    "mouseleave",
    pararDesenho
);

/* =========================
   TOUCH
========================= */

canvas.addEventListener(
    "touchstart",
    iniciarDesenho
);

canvas.addEventListener(
    "touchmove",
    desenhar
);

canvas.addEventListener(
    "touchend",
    pararDesenho
);

</script>

</body>
</html>
